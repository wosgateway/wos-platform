    <rect x="0" y="0" width="130" height="170" rx="8" fill="#ffffff" stroke="#c9d6cb" stroke-width="2"/>
    <rect x="16" y="24" width="98" height="8" rx="4" fill="#a9c6bd"/>
    <rect x="16" y="44" width="98" height="6" rx="3" fill="#dbe4dc"/>
    <rect x="16" y="58" width="70" height="6" rx="3" fill="#dbe4dc"/>
    <rect x="16" y="82" width="98" height="6" rx="3" fill="#dbe4dc"/>
    <rect x="16" y="96" width="60" height="6" rx="3" fill="#dbe4dc"/>
    <path d="M16 130 L28 142 L48 118" fill="none" stroke="#5b8c6e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="16" y="150" width="98" height="6" rx="3" fill="#dbe4dc"/>
  </g>

  <!-- shield, hero object -->
  <g transform="translate(255,90)">
    <path d="M110 0 C170 20 210 26 220 30 C220 130 190 210 110 250 C30 210 0 130 0 30 C10 26 50 20 110 0 Z" fill="#3f6b53"/>
