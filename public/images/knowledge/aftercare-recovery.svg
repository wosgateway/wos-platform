<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4efe4"/>
      <stop offset="100%" stop-color="#e9e1cf"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad9)"/>

  <!-- floor -->
  <rect x="0" y="360" width="800" height="90" fill="#dcd3bb"/>

  <!-- bed, hero object -->
  <g transform="translate(230,220)">
    <rect x="0" y="60" width="340" height="20" rx="6" fill="#3f6b53"/>
    <rect x="0" y="40" width="340" height="24" rx="10" fill="#5b8c6e"/>
    <rect x="10" y="20" width="70" height="30" rx="10" fill="#f4efe4" stroke="#c9bd9a" stroke-width="2"/>
    <rect x="90" y="30" width="230" height="20" rx="8" fill="#dbe4dc"/>
    <rect x="-6" y="60" width="10" height="90" fill="#3f6b53"/>
    <rect x="336" y="60" width="10" height="90" fill="#3f6b53"/>
    <!-- resting figure -->
    <circle cx="55" cy="20" r="14" fill="#f4efe4" stroke="#c9bd9a" stroke-width="2"/>
  </g>

  <!-- heart-rate monitor line, top right -->
  <g transform="translate(560,120)">
    <rect x="-70" y="-50" width="140" height="90" rx="12" fill="#ffffff" stroke="#c9d6cb" stroke-width="2"/>
    <path d="M-50 0 L-25 0 L-15 -25 L0 25 L15 -10 L25 0 L50 0" fill="none" stroke="#5b8c6e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- phone with call icon, representing follow-up / staying in touch -->
  <g transform="translate(150,300)">
    <rect x="-24" y="-40" width="48" height="80" rx="10" fill="#3f6b53"/>
    <rect x="-18" y="-30" width="36" height="52" rx="4" fill="#ffffff"/>
    <path d="M-8 -8 Q0 -18 8 -8 Q8 0 0 4 Q-8 0 -8 -8 Z" fill="#5b8c6e"/>
  </g>
</svg>
