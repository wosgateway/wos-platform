<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4efe4"/>
      <stop offset="100%" stop-color="#e9e1cf"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)"/>

  <!-- ground line -->
  <rect x="0" y="360" width="800" height="90" fill="#dcd3bb"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#c9bd9a" stroke-width="3"/>

  <!-- small clinic, left, low-rise -->
  <g transform="translate(140,220)">
    <rect x="0" y="70" width="150" height="70" fill="#ffffff" stroke="#c9d6cb" stroke-width="2"/>
    <path d="M-10 70 L75 20 L160 70 Z" fill="#5b8c6e"/>
    <rect x="30" y="95" width="26" height="45" fill="#a9c6bd"/>
    <rect x="94" y="95" width="26" height="45" fill="#a9c6bd"/>
    <!-- small cross sign -->
    <rect x="64" y="40" width="22" height="8" rx="2" fill="#3f6b53"/>
    <rect x="71" y="33" width="8" height="22" rx="2" fill="#3f6b53"/>
  </g>

  <!-- larger hospital, right, multi-storey -->
  <g transform="translate(430,110)">
    <rect x="0" y="0" width="230" height="250" fill="#ffffff" stroke="#c9d6cb" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="18" fill="#3f6b53"/>
    <!-- window grid -->
    <g fill="#a9c6bd">
      <rect x="18" y="34" width="26" height="26"/>
      <rect x="60" y="34" width="26" height="26"/>
      <rect x="102" y="34" width="26" height="26"/>
      <rect x="144" y="34" width="26" height="26"/>
      <rect x="186" y="34" width="26" height="26"/>

      <rect x="18" y="78" width="26" height="26"/>
      <rect x="60" y="78" width="26" height="26"/>
      <rect x="144" y="78" width="26" height="26"/>
      <rect x="186" y="78" width="26" height="26"/>

      <rect x="18" y="122" width="26" height="26"/>
      <rect x="60" y="122" width="26" height="26"/>
      <rect x="144" y="122" width="26" height="26"/>
      <rect x="186" y="122" width="26" height="26"/>

      <rect x="18" y="166" width="26" height="26"/>
      <rect x="186" y="166" width="26" height="26"/>
    </g>
    <!-- central cross emblem -->
    <rect x="99" y="78" width="32" height="80" fill="#5b8c6e"/>
    <rect x="75" y="102" width="80" height="32" fill="#5b8c6e"/>
    <rect x="106" y="90" width="18" height="56" fill="#f4efe4"/>
    <rect x="86" y="110" width="58" height="18" fill="#f4efe4"/>
    <!-- entrance -->
    <rect x="90" y="200" width="50" height="50" fill="#3f6b53"/>
  </g>
</svg>
