  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)"/>

  <!-- soft backdrop circle -->
  <circle cx="400" cy="225" r="170" fill="#d9e6dc"/>

  <!-- receipt / claim document, tucked behind the shield -->
