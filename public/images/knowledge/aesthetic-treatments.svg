<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4efe4"/>
      <stop offset="100%" stop-color="#e9e1cf"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad7)"/>
  <circle cx="400" cy="225" r="170" fill="#ece3cd"/>

  <!-- IV stand / drip line -->
  <g transform="translate(280,70)">
    <line x1="0" y1="0" x2="0" y2="260" stroke="#8fb6ac" stroke-width="6"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#8fb6ac" stroke-width="6"/>
    <line x1="-30" y1="260" x2="30" y2="260" stroke="#8fb6ac" stroke-width="8"/>
    <!-- bag -->
    <path d="M-24 10 L24 10 L20 90 Q0 105 -20 90 Z" fill="#ffffff" stroke="#c9d6cb" stroke-width="2"/>
    <rect x="-14" y="30" width="28" height="10" rx="4" fill="#a9c6bd"/>
    <!-- drip line -->
    <line x1="0" y1="90" x2="0" y2="150" stroke="#a9c6bd" stroke-width="4"/>
    <circle cx="0" cy="150" r="6" fill="#5b8c6e"/>
  </g>

  <!-- serum vial with dropper, hero object -->
  <g transform="translate(470,150)">
    <rect x="-30" y="20" width="60" height="90" rx="10" fill="#5b8c6e"/>
    <rect x="-30" y="20" width="60" height="24" rx="8" fill="#3f6b53"/>
    <rect x="-10" y="-20" width="20" height="46" rx="6" fill="#3f6b53"/>
    <ellipse cx="0" cy="-24" rx="14" ry="10" fill="#dbe4dc"/>
  </g>

  <!-- sparkle accents around the vial (anti-aging / glow motif) -->
  <g fill="#5b8c6e">
    <path d="M580 110 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
    <path d="M540 260 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z"/>
  </g>

  <!-- small DNA-like helix motif, bottom left (stem cell) -->
  <g transform="translate(190,320)" stroke="#3f6b53" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M0 0 C 30 20 30 40 0 60 C -30 80 -30 100 0 120"/>
    <path d="M0 0 C -30 20 -30 40 0 60 C 30 80 30 100 0 120"/>
    <line x1="-16" y1="20" x2="16" y2="20" stroke-width="4"/>
    <line x1="-16" y1="60" x2="16" y2="60" stroke-width="4"/>
    <line x1="-16" y1="100" x2="16" y2="100" stroke-width="4"/>
  </g>
</svg>
