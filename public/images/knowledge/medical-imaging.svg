<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2ee"/>
      <stop offset="100%" stop-color="#dfe8e0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad6)"/>
  <circle cx="400" cy="225" r="170" fill="#d9e6dc"/>

  <!-- scanner base -->
  <rect x="250" y="270" width="300" height="90" rx="14" fill="#ffffff" stroke="#c9d6cb" stroke-width="2"/>

  <!-- scanner ring, hero object -->
  <g transform="translate(400,220)">
    <circle cx="0" cy="0" r="140" fill="#3f6b53"/>
    <circle cx="0" cy="0" r="100" fill="#eef2ee"/>
    <circle cx="0" cy="0" r="70" fill="#5b8c6e"/>
  </g>

  <!-- scan table sliding through -->
  <rect x="120" y="205" width="200" height="24" rx="10" fill="#a9c6bd"/>
  <rect x="120" y="205" width="60" height="24" rx="10" fill="#8fb6ac"/>

  <!-- simple figure lying on table -->
  <g transform="translate(200,190)">
    <circle cx="0" cy="0" r="14" fill="#f4efe4" stroke="#c9bd9a" stroke-width="2"/>
    <rect x="10" y="-8" width="90" height="16" rx="8" fill="#f4efe4" stroke="#c9bd9a" stroke-width="2"/>
  </g>

  <!-- readout panel, top right -->
  <g transform="translate(600,90)">
    <rect x="-60" y="-40" width="120" height="80" rx="10" fill="#ffffff" stroke="#c9d6cb" stroke-width="2"/>
    <path d="M-45 10 L-25 -10 L-8 6 L10 -22 L28 0 L45 -14" fill="none" stroke="#5b8c6e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
